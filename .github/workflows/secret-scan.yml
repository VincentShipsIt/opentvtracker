name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-syntax:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # A workflow GitHub cannot parse is not an error, it is an absence: the file loses
      # its triggers and dispatching it fails with a confusing "no workflow_dispatch
      # trigger". Nothing else here reads these files, so nothing else would notice.
      - name: Parse every workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys
          import yaml

          failed = False
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  document = yaml.safe_load(path.read_text())
              except yaml.YAMLError as error:
                  print(f"::error file={path}::{error}")
                  failed = True
                  continue
              # PyYAML resolves the unquoted key "on" to the boolean True.
              if not document.get(True) and not document.get("on"):
                  print(f"::error file={path}::No trigger section; the workflow would never run.")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

  app-store-connect-helpers:
    name: App Store Connect helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Exercise bounded ASC request helpers
        shell: bash
        run: bash .github/scripts/app-store-connect.test.sh
