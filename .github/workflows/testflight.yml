name: TestFlight

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, branch, or tag on main to verify and optionally upload
        required: true
        default: main
        type: string
      gate_only:
        description: Verify the exact-SHA release gate without signing or uploading
        required: true
        default: false
        type: boolean
      marketing_version:
        description: Optional App Store version override (defaults to Xcode Release settings)
        required: false
        type: string
      build_number:
        description: Optional App Store build override (defaults to Xcode Release settings)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify exact source checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      WORKFLOW_REF: ${{ github.ref }}
      REQUIRED_CHECKS_TIMEOUT_SECONDS: 1800
      REQUIRED_CHECKS_POLL_INTERVAL_SECONDS: 15
    steps:
      # Never execute release-gate code from a historical source ref. This
      # checkout pins the helper to the same commit as the active workflow.
      - name: Check out trusted release gate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false

      - name: Check out requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source

      - name: Resolve immutable source SHA
        id: source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::TestFlight must be dispatched from the protected main workflow; received workflow ref $WORKFLOW_REF."
            exit 1
          fi
          git fetch origin main --no-tags
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release source did not resolve to one full Git SHA: $source_sha"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "::error::Release source $SOURCE_REF resolved to $source_sha, which is not on main."
            exit 1
          fi
          echo "Release source $SOURCE_REF resolved once to immutable main SHA $source_sha."
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Require exact-SHA push checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: bash gate/.github/scripts/required-checks.sh "$SOURCE_SHA"

  archive-and-upload:
    name: Archive and upload
    needs: verify-source
    if: inputs.gate_only == false
    runs-on: macos-26
    timeout-minutes: 45
    environment: testflight
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
      REQUESTED_MARKETING_VERSION: ${{ inputs.marketing_version }}
      REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
      # Config/Secrets.xcconfig is gitignored, so a CI archive would otherwise bake an
      # empty OpenTVAPIBaseURL into Info.plist and silently fall back to the public
      # TVMaze catalog. Not a credential: the proxy is guarded by App Attest.
      CATALOG_PROXY_BASE_URL: ${{ vars.CATALOG_PROXY_BASE_URL }}
    steps:
      - name: Define temporary paths
        shell: bash
        run: |
          {
            echo "ARCHIVE_PATH=$RUNNER_TEMP/OpenTVTracker.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/TestFlightExport"
            echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/TestFlightExportOptions.plist"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/opentv-signing.keychain-db"
            echo "KEYCHAIN_LIST_BACKUP=$RUNNER_TEMP/original-keychains.list"
            echo "CERTIFICATE_PATH=$RUNNER_TEMP/distribution-certificate.p12"
            echo "ASC_KEY_PATH=$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version

      - name: Resolve app version from immutable source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$checked_out_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Archive checkout $checked_out_sha does not match gated SHA $SOURCE_SHA."
            exit 1
          fi

          build_settings="$(xcodebuild \
            -project OpenTVTracker.xcodeproj \
            -target OpenTVTracker \
            -configuration Release \
            -showBuildSettings)"
          configured_marketing_version="$(awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / { print $2; exit }' <<< "$build_settings")"
          configured_build_number="$(awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / { print $2; exit }' <<< "$build_settings")"

          marketing_version="${REQUESTED_MARKETING_VERSION:-$configured_marketing_version}"
          if [[ ! "$marketing_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Marketing version must use X.Y.Z; received: $marketing_version" >&2
            exit 1
          fi
          build_number="$REQUESTED_BUILD_NUMBER"
          if [[ -z "$build_number" ]]; then
            build_number="$configured_build_number"
          fi
          if [[ ! "$build_number" =~ ^[1-9][0-9]*(\.[0-9]+){0,2}$ ]]; then
            echo "Build number must contain one to three integer components with a positive leading component; received: $build_number" >&2
            exit 1
          fi
          echo "Resolved App Store version $marketing_version ($build_number) from immutable SHA $SOURCE_SHA (requested as $SOURCE_REF)."
          echo "marketing_version=$marketing_version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          # Keep this on one line: a column-zero Python body would terminate the YAML
          # block scalar and make the workflow undispatchable.
          python3 -c 'import plistlib,sys; expected={"UIInterfaceOrientationPortrait","UIInterfaceOrientationPortraitUpsideDown","UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"}; plist=plistlib.load(open("Config/Info.plist","rb")); keys=("UISupportedInterfaceOrientations","UISupportedInterfaceOrientations~ipad"); missing={key:sorted(expected-set(plist.get(key,[]))) for key in keys}; failures=[key+": "+", ".join(values) for key,values in missing.items() if values]; sys.exit("Config/Info.plist is missing required orientations: "+"; ".join(failures)) if failures else None'

      - name: Validate release credentials
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_DISTRIBUTION_P12_BASE64 APPLE_DISTRIBUTION_P12_PASSWORD \
                      APPLE_API_PRIVATE_KEY_P8_BASE64 APPLE_TEAM_ID \
                      APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing TestFlight credential(s): %s\n' "${missing[*]}"
            exit 1
          fi
          # A release archive must never carry an https-less proxy URL: the app drops any
          # non-https base URL outside DEBUG, so a typo here degrades silently to TVMaze.
          if [[ -z "${CATALOG_PROXY_BASE_URL:-}" ]]; then
            echo "::warning::CATALOG_PROXY_BASE_URL is unset; this build will use the public TVMaze catalog."
          elif [[ "$CATALOG_PROXY_BASE_URL" != https://* ]]; then
            echo "::error::CATALOG_PROXY_BASE_URL must use https; received a non-https value."
            exit 1
          fi

      - name: Install signing material
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_API_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$keychain_password"
          echo "KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          mkdir -p "$(dirname "$ASC_KEY_PATH")"
          # App Store Connect hands the key over as a .p8 PEM file, and it is easy to paste
          # that text straight into the secret instead of base64 of it. Both are accepted:
          # decoding PEM text yields silent garbage, and the only symptom is an
          # "Authentication failed" from xcodebuild ten minutes later.
          if [[ "$APPLE_API_PRIVATE_KEY_P8_BASE64" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$APPLE_API_PRIVATE_KEY_P8_BASE64" > "$ASC_KEY_PATH"
          else
            printf '%s' "$APPLE_API_PRIVATE_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          fi
          chmod 600 "$CERTIFICATE_PATH" "$ASC_KEY_PATH"
          if ! grep -q 'BEGIN PRIVATE KEY' "$ASC_KEY_PATH"; then
            echo "::error::APPLE_API_PRIVATE_KEY_P8_BASE64 did not yield a PEM private key. Store either the .p8 file's contents or its base64 encoding."
            exit 1
          fi
          if ! openssl pkey -in "$ASC_KEY_PATH" -noout 2>/dev/null; then
            echo "::error::The decoded App Store Connect key is not a valid private key."
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security list-keychains -d user \
            | tr -d '"' \
            | sed 's/^[[:space:]]*//' > "$KEYCHAIN_LIST_BACKUP"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Manual App Store signing below must resolve the identity by name. Keep exactly
          # one distribution certificate reachable so that resolution is deterministic.
          identity_count="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -c 'Apple Distribution' || true)"
          if [[ "$identity_count" -ne 1 ]]; then
            echo "::error::Expected exactly one Apple Distribution identity; found $identity_count."
            exit 1
          fi

      - name: Prepare App Store provisioning profiles
        shell: bash
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          header="$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$APPLE_API_KEY_ID" | b64url)"
          payload="$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' \
            "$APPLE_API_ISSUER_ID" "$now" "$((now + 600))" | b64url)"
          # openssl emits a DER-wrapped ECDSA signature; a JWT wants the bare r‖s pair.
          # The unwrapping stays on one line because a block scalar ends at the first
          # column-zero line, and an indented Python script is a syntax error.
          signature="$(printf '%s.%s' "$header" "$payload" \
            | openssl dgst -sha256 -sign "$ASC_KEY_PATH" -binary \
            | xxd -p \
            | tr -d '\n' \
            | python3 -c 'import base64,sys; d=bytes.fromhex(sys.stdin.read().strip()); i=2 if d[1]<0x80 else 2+(d[1]&0x7f); lr=d[i+1]; r=int.from_bytes(d[i+2:i+2+lr],"big"); j=i+2+lr; ls=d[j+1]; s=int.from_bytes(d[j+2:j+2+ls],"big"); print(base64.urlsafe_b64encode(r.to_bytes(32,"big")+s.to_bytes(32,"big")).decode().rstrip("="))')"
          token="$header.$payload.$signature"
          echo "::add-mask::$token"

          export ASC_TOKEN="$token"
          export ASC_TMPDIR="$RUNNER_TEMP"
          # shellcheck source=../scripts/app-store-connect.sh
          source "${GITHUB_WORKSPACE:-.}/.github/scripts/app-store-connect.sh"

          bundle_ids_body="$RUNNER_TEMP/bundle-ids.json"
          if ! asc_get_collection \
            'https://api.appstoreconnect.apple.com/v1/bundleIds?limit=200' \
            "$bundle_ids_body"; then
            case "${ASC_LAST_STATUS:-}" in
              401)
                echo "::error::App Store Connect rejected the API key (401). Confirm the key is active and that APPLE_API_KEY_ID and APPLE_API_ISSUER_ID belong to the key stored in APPLE_API_PRIVATE_KEY_P8_BASE64."
                exit 1 ;;
              403)
                echo "::error::The key authenticated but is not allowed to read provisioning data (403). xcodebuild needs a team key with the App Manager or Admin role — an individual key, or a Developer-role key, authenticates and still cannot provision. Create one under App Store Connect > Users and Access > Integrations > Team Keys."
                exit 1 ;;
              *)
                echo "::error::Unexpected ${ASC_LAST_STATUS:-unknown} from the App Store Connect provisioning API."
                exit 1 ;;
            esac
          fi
          for identifier in dev.opentvtracker.app dev.opentvtracker.app.widgets; do
            if ! jq -e --arg identifier "$identifier" \
              '.data[] | select(.attributes.identifier == $identifier)' \
              "$bundle_ids_body" >/dev/null; then
              echo "::error::No registered bundle identifier '$identifier'. Register it under Certificates, Identifiers & Profiles before archiving."
              exit 1
            fi
          done

          certificates_body="$RUNNER_TEMP/certificates.json"
          asc_get_collection \
            'https://api.appstoreconnect.apple.com/v1/certificates?limit=200' \
            "$certificates_body"
          installed_certificate="$RUNNER_TEMP/distribution-certificate.pem"
          security find-certificate \
            -c 'Apple Distribution' \
            -p \
            "$KEYCHAIN_PATH" > "$installed_certificate"
          installed_hash="$(openssl x509 -in "$installed_certificate" -outform der \
            | shasum -a 256 \
            | awk '{print $1}')"
          certificate_id=""
          while IFS=$'\t' read -r candidate_id certificate_content; do
            candidate_hash="$(printf '%s' "$certificate_content" \
              | base64 --decode \
              | shasum -a 256 \
              | awk '{print $1}')"
            if [[ "$candidate_hash" == "$installed_hash" ]]; then
              certificate_id="$candidate_id"
              break
            fi
          done < <(jq -r '
            .data[]
            | select(
                .attributes.certificateType == "DISTRIBUTION"
                or .attributes.certificateType == "IOS_DISTRIBUTION"
              )
            | [.id, .attributes.certificateContent]
            | @tsv
          ' "$certificates_body")
          if [[ -z "$certificate_id" ]]; then
            echo "::error::The installed Apple Distribution certificate is not active in the Developer account."
            exit 1
          fi

          profiles_body="$RUNNER_TEMP/app-store-profiles.json"
          asc_get_collection \
            'https://api.appstoreconnect.apple.com/v1/profiles?filter[profileType]=IOS_APP_STORE&filter[profileState]=ACTIVE&limit=200' \
            "$profiles_body"
          profiles_dir="$RUNNER_TEMP/provisioning-profiles"
          legacy_profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          xcode_profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_dir" "$legacy_profiles_dir" "$xcode_profiles_dir"

          install_profile() {
            local identifier="$1"
            local output_name="$2"
            local bundle_id
            local profile_json
            local profile_name
            local profile_uuid
            local profile_content

            bundle_id="$(jq -r --arg identifier "$identifier" '
              .data[]
              | select(.attributes.identifier == $identifier)
              | .id
            ' "$bundle_ids_body")"
            profile_json="$(jq -c \
              --arg bundle_id "$bundle_id" \
              --arg certificate_id "$certificate_id" '
                first(
                  .data[]
                  | select(.relationships.bundleId.data.id == $bundle_id)
                  | select(any(
                      .relationships.certificates.data[]?;
                      .id == $certificate_id
                    ))
                ) // empty
              ' "$profiles_body")"

            if [[ -z "$profile_json" ]]; then
              profile_request="$RUNNER_TEMP/profile-request.json"
              profile_response="$RUNNER_TEMP/profile-response.json"
              profile_label="$(tr '.' '-' <<< "$identifier")"
              profile_name="OpenTV CI $profile_label $(date +%Y%m%d%H%M%S)"
              jq -n \
                --arg name "$profile_name" \
                --arg bundle_id "$bundle_id" \
                --arg certificate_id "$certificate_id" '
                  {
                    data: {
                      type: "profiles",
                      attributes: {
                        name: $name,
                        profileType: "IOS_APP_STORE"
                      },
                      relationships: {
                        bundleId: {
                          data: {
                            type: "bundleIds",
                            id: $bundle_id
                          }
                        },
                        certificates: {
                          data: [{
                            type: "certificates",
                            id: $certificate_id
                          }]
                        }
                      }
                    }
                  }
                ' > "$profile_request"
              asc_post \
                'https://api.appstoreconnect.apple.com/v1/profiles' \
                "$profile_request" \
                "$profile_response"
              profile_json="$(jq -c '.data' "$profile_response")"
            fi

            profile_name="$(jq -r '.attributes.name // empty' <<< "$profile_json")"
            profile_uuid="$(jq -r '.attributes.uuid // empty' <<< "$profile_json")"
            profile_content="$(jq -r '.attributes.profileContent // empty' <<< "$profile_json")"
            if [[ -z "$profile_name" || -z "$profile_uuid" || -z "$profile_content" ]]; then
              echo "::error::App Store Connect returned an incomplete profile for $identifier."
              exit 1
            fi
            printf '%s' "$profile_content" \
              | base64 --decode > "$profiles_dir/$profile_uuid.mobileprovision"
            cp \
              "$profiles_dir/$profile_uuid.mobileprovision" \
              "$legacy_profiles_dir/$profile_uuid.mobileprovision"
            cp \
              "$profiles_dir/$profile_uuid.mobileprovision" \
              "$xcode_profiles_dir/$profile_uuid.mobileprovision"
            printf -v "$output_name" '%s' "$profile_name"
            echo "$output_name=$profile_name" >> "$GITHUB_ENV"
            echo "Prepared App Store profile '$profile_name' for $identifier."
          }

          install_profile dev.opentvtracker.app APP_STORE_PROFILE_NAME
          install_profile dev.opentvtracker.app.widgets WIDGET_STORE_PROFILE_NAME

          cp Config/TestFlightExportOptions.plist "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Set :signingStyle manual' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:dev.opentvtracker.app string $APP_STORE_PROFILE_NAME" \
            "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles:dev.opentvtracker.app.widgets string $WIDGET_STORE_PROFILE_NAME" \
            "$EXPORT_OPTIONS_PATH"

      - name: Archive release
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project OpenTVTracker.xcodeproj \
            -scheme OpenTVTracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CATALOG_PROXY_BASE_URL="$CATALOG_PROXY_BASE_URL" \
            APP_ATTEST_DEVELOPMENT_TOKEN="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            APP_STORE_PROFILE_NAME="$APP_STORE_PROFILE_NAME" \
            WIDGET_STORE_PROFILE_NAME="$WIDGET_STORE_PROFILE_NAME" \
            MARKETING_VERSION='${{ steps.release.outputs.marketing_version }}' \
            CURRENT_PROJECT_VERSION='${{ steps.release.outputs.build_number }}' \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export archive
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH"

      - name: Validate and upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=("$EXPORT_PATH"/*.ipa)
          if [[ "${#ipa_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one exported IPA; found ${#ipa_files[@]}." >&2
            exit 1
          fi
          cd "$(dirname "$(dirname "$ASC_KEY_PATH")")"
          xcrun altool --validate-app \
            --type ios \
            --file "${ipa_files[0]}" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
          xcrun altool --upload-app \
            --type ios \
            --file "${ipa_files[0]}" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          if [[ -s "$KEYCHAIN_LIST_BACKUP" ]]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$KEYCHAIN_LIST_BACKUP") || true
          fi
          rm -f "$CERTIFICATE_PATH" "$ASC_KEY_PATH" "$KEYCHAIN_LIST_BACKUP"
