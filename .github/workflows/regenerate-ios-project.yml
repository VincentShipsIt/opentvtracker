name: Regenerate iOS project

# Adding or removing a Swift file changes OpenTVTracker.xcodeproj/project.pbxproj, which is
# generated by a pinned XcodeGen and must stay byte-stable. Contributors without a Mac
# (or an agent in a Linux sandbox) cannot produce it, so this workflow does it on a runner,
# commits the result to the branch it was dispatched on, and re-dispatches the iOS workflow.
# Pushes made with GITHUB_TOKEN do not trigger other workflows, hence the explicit dispatch.

on:
  workflow_dispatch:

concurrency:
  group: regenerate-ios-project-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    name: regenerate
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Refuse the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Regenerate on a feature branch and merge it; the default branch only takes reviewed changes."
          exit 1
      - uses: actions/checkout@v6
      - name: Generate the pinned Xcode project
        run: .github/scripts/generate-ios-project.sh generate
      - name: Commit the regenerated project
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- OpenTVTracker.xcodeproj)" ]; then
            echo "The committed Xcode project is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OpenTVTracker.xcodeproj
          git commit -m "Regenerate Xcode project"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Run the iOS workflow on the new commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ios.yml --ref "$GITHUB_REF_NAME"
