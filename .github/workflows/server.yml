name: Server

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    name: test-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - name: Exercise production deploy validation
        working-directory: .
        run: bash deploy/aws/deploy-opentvtracker.test.sh
      - name: Exercise exact-SHA release gate
        working-directory: .
        run: bash .github/scripts/required-checks.test.sh
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: Build the production Docker image
        working-directory: .
        run: docker build --tag opentvtracker-server:ci .
