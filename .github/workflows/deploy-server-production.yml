name: Deploy server production

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "Dockerfile"
      - "deploy/aws/**"
      - ".github/workflows/deploy-server-production.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-opentvtracker-dev-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: Production
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARTIFACT_BUCKET: relaypress-production-deploy-948918267147-us-west-1
      AWS_REGION: us-west-1
      INSTANCE_ID: i-00e74422e719396c3
      IMAGE_NAME: api-opentvtracker-dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::948918267147:role/relaypress-github-production-deploy
          aws-region: us-west-1

      - name: Build production image
        run: docker build --file Dockerfile --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Upload immutable image artifact
        run: |
          set -euo pipefail
          artifact_file="${RUNNER_TEMP}/api-opentvtracker-dev-${GITHUB_SHA}.tar.gz"
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip >"$artifact_file"
          aws s3 cp \
            "$artifact_file" \
            "s3://${ARTIFACT_BUCKET}/images/api-opentvtracker-dev-${GITHUB_SHA}.tar.gz" \
            --only-show-errors

      - name: Upload host deploy script
        run: |
          set -euo pipefail
          aws s3 cp \
            deploy/aws/deploy-opentvtracker.sh \
            "s3://${ARTIFACT_BUCKET}/scripts/deploy-opentvtracker-${GITHUB_SHA}.sh" \
            --only-show-errors

      - name: Deploy through Systems Manager
        run: |
          set -euo pipefail
          image_key="images/api-opentvtracker-dev-${GITHUB_SHA}.tar.gz"
          script_key="scripts/deploy-opentvtracker-${GITHUB_SHA}.sh"
          parameters="$(
            jq -cn \
              --arg bucket "$ARTIFACT_BUCKET" \
              --arg region "$AWS_REGION" \
              --arg script_key "$script_key" \
              --arg image_key "$image_key" \
              --arg sha "$GITHUB_SHA" \
              '{commands: [
                 "set -euo pipefail",
                 "script_file=\"$(mktemp)\"",
                 "aws s3 cp \"s3://\($bucket)/\($script_key)\" \"$script_file\" --region \($region) --only-show-errors",
                 "install -m 755 \"$script_file\" /usr/local/bin/deploy-opentvtracker",
                 "rm -f \"$script_file\"",
                 "/usr/local/bin/deploy-opentvtracker \($image_key|@sh) \($sha|@sh)"
               ]}'
          )"
          command_id="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters "$parameters" \
              --comment "Deploy OpenTV Tracker API ${GITHUB_SHA}" \
              --query "Command.CommandId" \
              --output text
          )"

          invocation=""
          status="Pending"
          for _ in $(seq 1 120); do
            if invocation="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "$INSTANCE_ID" \
                --output json \
                2>/dev/null
            )"; then
              status="$(jq -r '.Status' <<<"$invocation")"
              case "$status" in
                Success|Failed|TimedOut|Cancelled|Cancelling)
                  break
                  ;;
              esac
            fi
            sleep 5
          done

          if [[ -n "$invocation" ]]; then
            jq -r '"Host status: \(.Status)\n\nHost stdout:\n\(.StandardOutputContent)\n\nHost stderr:\n\(.StandardErrorContent)"' \
              <<<"$invocation"
          fi
          if [[ "$status" != "Success" ]]; then
            echo "Deployment failed with SSM status ${status}" >&2
            exit 1
          fi

      - name: Verify public API route
        run: |
          set -euo pipefail
          response="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              https://api.opentvtracker.dev/health
          )"
          jq -e '.status == "ok"' <<<"$response"
