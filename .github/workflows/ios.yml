name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode with an installed iOS runtime
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app
      - name: Show toolchain
        run: xcodebuild -version
      - name: Verify reproducible Xcode project
        run: .github/scripts/generate-ios-project.sh check
      - name: Enforce pinned SwiftLint
        run: .github/scripts/run-swiftlint.sh
      - name: Resolve locked Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project OpenTVTracker.xcodeproj
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -onlyUsePackageVersionsFromResolvedFile
          -disableAutomaticPackageResolution
      - name: Validate privacy manifest
        run: plutil -lint OpenTVTracker/Resources/PrivacyInfo.xcprivacy
      - name: Build and test
        run: >-
          xcodebuild test
          -project OpenTVTracker.xcodeproj
          -scheme OpenTVTracker
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -onlyUsePackageVersionsFromResolvedFile
          -disableAutomaticPackageResolution
          -skip-testing:OpenTVTrackerUITests/AccessibilityEvidenceUITests
          -resultBundlePath "$RUNNER_TEMP/OpenTVTrackerTests.xcresult"
          CODE_SIGNING_ALLOWED=NO
      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: opentvtracker-test-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/OpenTVTrackerTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
